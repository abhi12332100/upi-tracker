<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md" id="mainCard">
        <div id="loading" class="text-center text-gray-500">Loading details...</div>
        <div id="paymentDetails" class="hidden">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Payment Request</h2>
            </div>
            <div class="bg-indigo-50 p-4 rounded-lg mb-6 border border-indigo-100">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-gray-600 text-sm">Paying to:</span>
                    <span id="clientName" class="font-bold text-gray-800"></span>
                </div>
                <div class="flex justify-between items-center mb-3">
                    <span class="text-gray-600 text-sm">UPI ID:</span>
                    <div class="flex items-center gap-2">
                        <span id="clientUpi" class="font-mono bg-white px-2 py-1 rounded border text-sm"></span>
                        <button onclick="copyUpiClient()" class="bg-blue-500 text-white text-xs px-2 py-1 rounded hover:bg-blue-600">Copy</button>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-600 text-sm">Amount:</span>
                    <span id="clientAmount" class="text-xl font-bold text-indigo-700"></span>
                </div>
            </div>
            <div id="statusDisplay" class="mb-4 text-center hidden"></div>
            <form id="paymentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">UTR (Optional)</label>
                    <input type="text" id="utrInput" placeholder="Enter UTR" class="w-full border p-2 rounded focus:outline-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Screenshot (Optional)</label>
                    <input type="file" id="screenshotInput" accept="image/*" class="w-full border p-2 rounded text-sm bg-gray-50">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">Done (I have paid)</button>
            </form>
            <div class="mt-6 text-center border-t pt-4">
                <p class="text-xs text-gray-500 mb-2">Marked by mistake?</p>
                <button onclick="raiseDisputeClient()" class="text-sm text-red-600 font-semibold hover:underline">Raise Dispute</button>
            </div>
        </div>
        <div id="errorState" class="hidden text-center text-red-500">Invalid Link.</div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');
        let currentUpi = '';
        async function loadClientData() {
            if (!userId) { document.getElementById('loading').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); return; }
            const res = await fetch(`/api/client/${userId}`);
            if (!res.ok) { document.getElementById('loading').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); return; }
            const user = await res.json();
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('paymentDetails').classList.remove('hidden');
            document.getElementById('clientName').innerText = user.name;
            document.getElementById('clientUpi').innerText = user.upiId;
            document.getElementById('clientAmount').innerText = `₹${user.amount}`;
            currentUpi = user.upiId;
            if (user.status === 'done') {
                document.getElementById('statusDisplay').classList.remove('hidden');
                document.getElementById('statusDisplay').innerHTML = '<span class="bg-green-100 text-green-800 px-4 py-2 rounded-full font-bold text-sm">✅ Marked Done</span>';
                document.getElementById('paymentForm').classList.add('hidden');
            } else if (user.status === 'disputed') {
                document.getElementById('statusDisplay').classList.remove('hidden');
                document.getElementById('statusDisplay').innerHTML = '<span class="bg-red-100 text-red-800 px-4 py-2 rounded-full font-bold text-sm">⚠️ Under Dispute</span>';
                document.getElementById('paymentForm').classList.add('hidden');
            }
            if (user.utr) document.getElementById('utrInput').value = user.utr;
        }
        function copyUpiClient() { if (currentUpi) navigator.clipboard.writeText(currentUpi).then(() => alert(`Copied: ${currentUpi}`)); }
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Submitting...'; btn.disabled = true;
            const utr = document.getElementById('utrInput').value;
            const file = document.getElementById('screenshotInput').files[0];
            const formData = new FormData();
            formData.append('utr', utr);
            if (file) formData.append('screenshot', file);
            const res = await fetch(`/api/client/${userId}/done`, { method: 'POST', body: formData });
            if (res.ok) {
                document.getElementById('statusDisplay').classList.remove('hidden');
                document.getElementById('statusDisplay').innerHTML = '<span class="bg-green-100 text-green-800 px-4 py-2 rounded-full font-bold text-sm">✅ Marked Done</span>';
                document.getElementById('paymentForm').classList.add('hidden');
                window.scrollTo(0, 0);
            } else {
                alert('Error!'); btn.innerText = 'Done (I have paid)'; btn.disabled = false;
            }
        });
        async function raiseDisputeClient() {
            if (!confirm('Raise Dispute?')) return;
            await fetch(`/api/client/${userId}/dispute`, { method: 'POST' });
            document.getElementById('statusDisplay').classList.remove('hidden');
            document.getElementById('statusDisplay').innerHTML = '<span class="bg-red-100 text-red-800 px-4 py-2 rounded-full font-bold text-sm">⚠️ Under Dispute</span>';
            document.getElementById('paymentForm').classList.add('hidden');
        }
        loadClientData();
    </script>
</body>
</html>
