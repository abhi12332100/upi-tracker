<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Dashboard</h1>
        <button onclick="location.reload()" class="bg-indigo-800 px-3 py-1 rounded text-sm hover:bg-indigo-900">Refresh Data</button>
    </nav>
    <div class="max-w-4xl mx-auto mt-6 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-semibold mb-4 text-gray-700">Add New Client</h2>
        <form id="addForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" id="name" placeholder="Client Name" required class="border p-2 rounded focus:outline-indigo-500">
            <input type="text" id="upiId" placeholder="UPI ID" required class="border p-2 rounded focus:outline-indigo-500">
            <input type="number" id="amount" placeholder="Amount (₹)" required class="border p-2 rounded focus:outline-indigo-500">
            <button type="submit" class="bg-green-600 text-white font-bold p-2 rounded hover:bg-green-700">Add Client</button>
        </form>
    </div>
    <div class="max-w-6xl mx-auto mt-6 grid grid-cols-3 gap-4 text-center">
        <div class="bg-white p-4 rounded shadow border-t-4 border-blue-500">
            <h3 class="text-gray-500 text-sm">Total Clients</h3>
            <p id="totalCount" class="text-2xl font-bold text-gray-800">0</p>
        </div>
        <div class="bg-white p-4 rounded shadow border-t-4 border-green-500">
            <h3 class="text-gray-500 text-sm">Payment Done</h3>
            <p id="doneCount" class="text-2xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white p-4 rounded shadow border-t-4 border-red-500">
            <h3 class="text-gray-500 text-sm">Pending/Disputed</h3>
            <p id="pendingCount" class="text-2xl font-bold text-red-600">0</p>
        </div>
    </div>
    <div class="max-w-6xl mx-auto mt-6 bg-white rounded-lg shadow-md overflow-x-auto mb-10">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-200 text-gray-700">
                    <th class="p-3 border-b">Name</th>
                    <th class="p-3 border-b">UPI ID</th>
                    <th class="p-3 border-b">Amount</th>
                    <th class="p-3 border-b">Status</th>
                    <th class="p-3 border-b">UTR / Screenshot</th>
                    <th class="p-3 border-b">Action</th>
                </tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>
    <script>
        const API_BASE = '/api/admin';
        async function loadUsers() {
            const res = await fetch(`${API_BASE}/users`);
            const users = await res.json();
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = '';
            let total = users.length, done = 0, pending = 0;
            users.forEach(user => {
                if (user.status === 'done') done++; else pending++;
                let statusBadge = user.status === 'pending' ? '<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-bold">Pending</span>' :
                                  user.status === 'done' ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Done ✅</span>' :
                                  '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold">Disputed ⚠️</span>';
                let screenshotHtml = user.utr ? `<div class="text-xs text-gray-600 mt-1">UTR: ${user.utr}</div>` : '';
                if (user.screenshotUrl) screenshotHtml += `<a href="${user.screenshotUrl}" target="_blank" class="text-xs text-blue-600 underline block mt-1">View Screenshot</a>`;
                if (!user.utr && !user.screenshotUrl && user.status === 'done') screenshotHtml = '<span class="text-xs text-gray-400">No details</span>';
                let disputeBtn = user.status === 'done' ? `<button onclick="raiseDispute('${user._id}')" class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded hover:bg-orange-200 mt-1">Raise Dispute</button>` : '';
                let clientLink = `<a href="/pay.html?id=${user._id}" target="_blank" class="text-xs text-indigo-600 underline block">Client Link</a>`;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 border-b';
                tr.innerHTML = `
                    <td class="p-3 font-medium text-gray-800">${user.name}</td>
                    <td class="p-3">
                        <div class="flex items-center gap-2">
                            <span class="font-mono text-sm bg-gray-100 p-1 rounded">${user.upiId}</span>
                            <button onclick="copyUpi('${user.upiId}')" class="bg-blue-500 text-white text-xs px-2 py-1 rounded hover:bg-blue-600">Copy</button>
                        </div>
                    </td>
                    <td class="p-3 font-bold text-gray-700">₹${user.amount}</td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3">${screenshotHtml}</td>
                    <td class="p-3">${clientLink}${disputeBtn}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('totalCount').innerText = total;
            document.getElementById('doneCount').innerText = done;
            document.getElementById('pendingCount').innerText = pending;
        }
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const upiId = document.getElementById('upiId').value;
            const amount = document.getElementById('amount').value;
            const res = await fetch(`${API_BASE}/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, upiId, amount })
            });
            if (res.ok) { document.getElementById('addForm').reset(); loadUsers(); }
        });
        function copyUpi(text) { navigator.clipboard.writeText(text).then(() => alert(`Copied: ${text}`)); }
        async function raiseDispute(id) {
            if (confirm('Mark as Disputed?')) {
                await fetch(`${API_BASE}/dispute/${id}`, { method: 'POST' });
                loadUsers();
            }
        }
        loadUsers();
    </script>
</body>
</html>
